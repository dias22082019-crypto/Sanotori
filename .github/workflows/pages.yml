name: Deploy to GitHub Pages

# Публикует приложение на https://dias22082019-crypto.github.io/Sanotori/ после каждого изменения main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /Sanotori/
      # Публичные значения Supabase (адрес проекта и publishable key). Секретные ключи сюда не кладутся.
      VITE_SUPABASE_URL: https://oixxarqpylymeqsfgdul.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_1dsIUt4Zs8ogywGbtgwm6Q_wA2q4Cf9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA: GitHub Pages отдаёт 404.html на любой неизвестный путь, а роутер приложения сам откроет нужную страницу
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
